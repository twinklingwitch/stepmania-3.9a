# Build StepMania on an Apple Silicon Mac, run the tests, and make StepMania.app.
#
# Manual only (Actions, "macOS", "Run workflow"), so it never uses the
# repository's Actions minutes unless someone starts it.  macOS runners count
# ten times against the minutes of a private repository; a run takes roughly
# 10 to 15 minutes.
name: macOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (Apple Silicon).  The app runs on the macOS it was built on and later, since the Homebrew libraries are built for it.'
        type: choice
        options:
          - macos-14
          - macos-15
        default: macos-14
      ffmpeg:
        description: 'Build with FFmpeg (movie backgrounds; about 100 more libraries in the app)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install the dependencies
        run: |
          brew install meson ninja pkgconf sdl3 libpng pcre2 libsamplerate openssl@3 \
            libvorbis mad jpeg-turbo ${{ inputs.ffmpeg && 'ffmpeg' || '' }}

      - name: Configure
        run: |
          # openssl@3 (and jpeg-turbo, if it is keg-only) aren't on pkg-config's path.
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          meson setup build -Dtests=true -Donline=enabled -Dvorbis=enabled -Dmad=enabled \
            -Djpeg=enabled -Dffmpeg=${{ inputs.ffmpeg && 'enabled' || 'disabled' }}

      - name: Build
        run: meson compile -C build

      - name: Make StepMania.app
        run: |
          Utils/macos-bundle.sh build out
          ditto -c -k --sequesterRsrc --keepParent out/StepMania.app out/StepMania-macos-arm64.zip

      # Zipped, because artifacts lose the executable bits and the signatures.
      - uses: actions/upload-artifact@v4
        with:
          name: StepMania-macos-arm64
          path: out/StepMania-macos-arm64.zip

      - name: Load songs with the app's own executable
        run: |
          # Runs from the bundle without a window: checks that the bundled
          # libraries load, that the data is found in Contents/Resources, and
          # MinaCalc on ARM.
          mkdir -p smoke/Pack/Tiny smoke/Pack/Fancy
          cp src/tests/chartkey/tiny.sm smoke/Pack/Tiny/
          cp src/tests/chartkey/fancy-one.sm smoke/Pack/Fancy/
          # Songs without music aren't loaded; five seconds of silence will do.
          for d in Tiny Fancy; do
            python3 -c 'import wave, sys; w = wave.open(sys.argv[1], "wb"); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(bytes(4 * 44100 * 5)); w.close()' smoke/Pack/$d/music.wav
          done
          out/StepMania.app/Contents/MacOS/stepmania --export-charts="$PWD/smoke/Pack" --export-out="$PWD/smoke/pack.json"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(len(d["charts"]), "charts:", [(c.get("title"), c["msd"][3][0] if c.get("msd") else None) for c in d["charts"]]); sys.exit(len(d["charts"]) != 5)' smoke/pack.json

      - name: Try starting the game
        # The runner is a virtual machine without a real GPU, so OpenGL may not
        # work here.  The log and a screenshot are in the logs artifact.
        continue-on-error: true
        run: |
          user="$HOME/Library/Application Support/StepMania/3.9"
          mkdir -p "$user/Data"
          printf '[Options]\nWindowed=1\n' > "$user/Data/StepMania.ini"
          out/StepMania.app/Contents/MacOS/stepmania > game-stdout.txt 2>&1 &
          pid=$!
          sleep 30
          screencapture -x game-screen.png || true
          kill $pid || true
          sleep 3
          kill -9 $pid 2>/dev/null || true
          cp "$user/log.txt" game-log.txt || true
          cp "$user/info.txt" game-info.txt || true
          tail -n 40 game-log.txt || true

      - name: Test
        run: meson test -C build --print-errorlogs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build/meson-logs/
            smoke/pack.json
            game-*.txt
            game-screen.png
          if-no-files-found: ignore
